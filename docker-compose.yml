# Local production-like stack: Postgres + pgvector, a one-off ingestion job, the API.
#   docker compose up --build                    # offline providers, no keys needed
#   docker compose --profile ollama up --build   # plus a local Ollama server
# Provider settings are read from .env (copy .env.example).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-retail}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-retail}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingest:
    build: .
    command: ["retail-rag", "ingest"]
    env_file: [{ path: .env, required: false }]
    environment: &db_env
      RAG_VECTOR_STORE: postgres
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@db:5432/${POSTGRES_DB:-retail}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: .
    env_file: [{ path: .env, required: false }]
    environment: *db_env
    ports: ["8000:8000"]
    depends_on:
      ingest: { condition: service_completed_successfully }

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

volumes:
  pgdata:
  ollama:
