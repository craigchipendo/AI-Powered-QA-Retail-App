[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-rag"
version = "1.0.0"
description = "Production-style RAG assistant for a retail product catalogue: hybrid pgvector search, grounded answers with citations, pluggable LLM and embedding providers, evaluation and observability."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Craig Tanaka Chipendo" }]
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.2.5",
    "numpy>=1.26",
    "pandas>=2.1",
    "httpx>=0.27",
    "tenacity>=8.2",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vertex = ["google-genai>=1.0"]
openai = ["openai>=1.40"]
local = ["sentence-transformers>=2.7"]
dev = ["pytest>=8.0", "ruff>=0.5", "pre-commit>=3.6"]
all = ["retail-rag[vertex,openai,local]"]

[project.scripts]
retail-rag = "retail_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_rag = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: needs a Postgres+pgvector database (RAG_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]
